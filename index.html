<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiCard Lab</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2>DIGICARD LAB</h2>

    <button onclick="showPage('home')">🏠 ホーム</button>
    <button onclick="showPage('cards')">📖 カード図鑑</button>
    <button onclick="showPage('deck')">🃏 デッキ構築</button>
    <button onclick="showPage('analysis')">📊 デッキ分析</button>
    <button onclick="showPage('guide')">📚 初心者ガイド</button>

</div>

<div class="content">

    <section id="home" class="page active">
        <h1>ようこそ！</h1>

        <div class="card">
            <h2>DigiCard Lab</h2>

            <p>
                デジモンカード初心者向けの
                デッキ構築サポートアプリです。
            </p>

            <p>
                左側のメニューから
                機能を選んでください。
            </p>
        </div>
    </section>

<section id="cards" class="page">
    <div class="page-header">
        <div>
            <p class="eyebrow">CARD DATABASE</p>
            <h1>カード図鑑</h1>
        </div>

        <p id="cardCount" class="result-count">0件</p>
    </div>

    <div class="filter-panel">
        <input
            id="searchInput"
            type="search"
            placeholder="カード名・カード番号で検索"
        >

        <select id="colorFilter">
            <option value="">すべての色</option>
            <option value="赤">赤</option>
            <option value="青">青</option>
            <option value="黄">黄</option>
            <option value="緑">緑</option>
            <option value="黒">黒</option>
            <option value="紫">紫</option>
            <option value="白">白</option>
        </select>

        <select id="typeFilter">
            <option value="">すべての種類</option>
            <option value="デジモン">デジモン</option>
            <option value="デジタマ">デジタマ</option>
            <option value="テイマー">テイマー</option>
            <option value="オプション">オプション</option>
        </select>

        <select id="levelFilter">
            <option value="">すべてのレベル</option>
            <option value="2">Lv.2</option>
            <option value="3">Lv.3</option>
            <option value="4">Lv.4</option>
            <option value="5">Lv.5</option>
            <option value="6">Lv.6</option>
            <option value="7">Lv.7</option>
        </select>
    </div>

    <div id="cardList" class="card-grid"></div>
</section>

    <section id="deck" class="page">
        <h1>デッキ構築</h1>
    </section>

    <section id="analysis" class="page">
        <h1>デッキ分析</h1>
    </section>

    <section id="guide" class="page">
        <h1>初心者ガイド</h1>
    </section>

</div>

<!-- カード詳細モーダル -->
<div id="cardModal" class="modal" aria-hidden="true">
    <div class="modal-overlay" data-close-modal></div>

    <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalCardName"
    >
        <button
            id="modalCloseButton"
            class="modal-close"
            type="button"
            aria-label="閉じる"
        >
            ×
        </button>

        <div class="modal-layout">
            <div id="modalCardImage" class="modal-card-image"></div>

            <div class="modal-card-details">
                <p id="modalCardNumber" class="modal-card-number"></p>
                <h2 id="modalCardName"></h2>

                <div id="modalCardTags" class="card-tags"></div>

                <div class="detail-grid">
                    <div>
                        <span>登場コスト</span>
                        <strong id="modalPlayCost">-</strong>
                    </div>

                    <div>
                        <span>DP</span>
                        <strong id="modalDp">-</strong>
                    </div>

                    <div>
                        <span>形態</span>
                        <strong id="modalForm">-</strong>
                    </div>

                    <div>
                        <span>属性</span>
                        <strong id="modalAttribute">-</strong>
                    </div>

                    <div>
                        <span>レアリティ</span>
                        <strong id="modalRarity">-</strong>
                    </div>

                    <div>
                        <span>収録</span>
                        <strong id="modalSet">-</strong>
                    </div>
                </div>

                <section class="detail-section">
                    <h3>進化条件</h3>
                    <div id="modalDigivolutionCosts"></div>
                </section>

                <section class="detail-section">
                    <h3>特徴</h3>
                    <p id="modalTraits"></p>
                </section>

                <section class="detail-section">
                    <h3>カード効果</h3>
                    <p id="modalEffect"></p>
                </section>

                <section class="detail-section">
                    <h3>進化元効果</h3>
                    <p id="modalInheritedEffect"></p>
                </section>

                <section class="detail-section">
                    <h3>セキュリティ効果</h3>
                    <p id="modalSecurityEffect"></p>
                </section>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
