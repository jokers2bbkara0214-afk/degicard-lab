<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiCard Lab</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2>DIGICARD LAB</h2>

    <button onclick="showPage('home')">🏠 ホーム</button>
    <button onclick="showPage('cards')">📖 カード図鑑</button>
    <button onclick="showPage('deck')">🃏 デッキ構築</button>
    <button onclick="showPage('analysis')">📊 デッキ分析</button>
    <button onclick="showPage('guide')">📚 初心者ガイド</button>

</div>

<div class="content">

    <section id="home" class="page active">
        <h1>ようこそ！</h1>

        <div class="card">
            <h2>DigiCard Lab</h2>

            <p>
                デジモンカード初心者向けの
                デッキ構築サポートアプリです。
            </p>

            <p>
                左側のメニューから
                機能を選んでください。
            </p>
        </div>
    </section>

<section id="cards" class="page">
    <div class="page-header">
        <div>
            <p class="eyebrow">CARD DATABASE</p>
            <h1>カード図鑑</h1>
        </div>

        <p id="cardCount" class="result-count">0件</p>
    </div>

    <div class="filter-panel">
        <input
            id="searchInput"
            type="search"
            placeholder="カード名・カード番号で検索"
        >

        <select id="colorFilter">
            <option value="">すべての色</option>
            <option value="赤">赤</option>
            <option value="青">青</option>
            <option value="黄">黄</option>
            <option value="緑">緑</option>
            <option value="黒">黒</option>
            <option value="紫">紫</option>
            <option value="白">白</option>
        </select>

        <select id="typeFilter">
            <option value="">すべての種類</option>
            <option value="デジモン">デジモン</option>
            <option value="デジタマ">デジタマ</option>
            <option value="テイマー">テイマー</option>
            <option value="オプション">オプション</option>
        </select>

        <select id="levelFilter">
            <option value="">すべてのレベル</option>
            <option value="2">Lv.2</option>
            <option value="3">Lv.3</option>
            <option value="4">Lv.4</option>
            <option value="5">Lv.5</option>
            <option value="6">Lv.6</option>
            <option value="7">Lv.7</option>
        </select>
    </div>

    <div id="cardList" class="card-grid"></div>
</section>

    <section id="deck" class="page">
        <h1>デッキ構築</h1>
    </section>

    <section id="analysis" class="page">
        <h1>デッキ分析</h1>
    </section>

    <section id="guide" class="page">
        <h1>初心者ガイド</h1>
    </section>

</div>

<script src="script.js"></script>

</body>
</html>
